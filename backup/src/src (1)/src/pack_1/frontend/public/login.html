<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Rajarata Digital Bank</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body class="auth-body" data-page="login">
  <main class="auth-card">
    <a class="brand" href="index.html">RAJARATA<span>BANK</span></a>
    <h1>Welcome back</h1>
    <span class="muted">Log in to manage your accounts.</span>
    <div id="banner" class="hidden"></div>
    <form id="loginForm" novalidate>
      <div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <div class="form-msg hidden"></div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="auth-foot">New to Rajarata Bank? <a href="register.html">Create an account</a></p>
  </main>
  <script src="portal.js"></script><script src="auth.js"></script>
</body>
</html>
